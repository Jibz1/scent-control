name: Label pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to label
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read the configuration from the base repository through GitHub's API.
      # Do not check out or execute PR code in this privileged workflow.
      # Labels are pre-created; adding a new name requires creating it on GitHub.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
