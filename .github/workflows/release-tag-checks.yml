name: Check release tooling

on:
  pull_request:
    paths:
      - .github/workflows/release-tag*.yml
      - scripts/release_tag.py
      - tools/tests/test_release_tags.py
  push:
    branches: [main]
    paths:
      - .github/workflows/release-tag*.yml
      - scripts/release_tag.py
      - tools/tests/test_release_tags.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/tests -p test_release_tags.py -v
