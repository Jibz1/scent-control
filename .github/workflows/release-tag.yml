name: Tag component release
run-name: Tag ${{ inputs.component }}/v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        required: true
        type: choice
        options:
          - desktop
          - server
          - mobile
          - scent-core
          - tools
      version:
        description: Version already committed in the component manifest (no v prefix)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check release tooling
        run: python3 -m unittest discover -s tools/tests -p test_release_tags.py -v
      - name: Create annotated tag
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release_tag.py "$RELEASE_COMPONENT" "$RELEASE_VERSION" --push
