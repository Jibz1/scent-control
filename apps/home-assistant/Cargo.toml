[package]
name = "scent-home-assistant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
scent-core = { path = "../../packages/scent-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rumqttc = { version = "=0.25.1", default-features = false, features = ["websocket", "use-rustls"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["net", "io-util"] }
