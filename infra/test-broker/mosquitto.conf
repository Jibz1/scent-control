per_listener_settings false
listener 8080
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Match the desktop app's MAX_PACKET_SIZE (256 KiB): no client can store a retained
# message the app can't read (one would drop its connection on every resubscribe).
max_packet_size 262144
# The default, pinned: the diffusers subscribe at QoS 0, so nothing is queued for an
# offline diffuser and no command arrives late after a restart.
queue_qos0_messages false
# A persistent (clean_session=false) session away longer than this is dropped from
# disk with anything queued for it.
persistent_client_expiration 7d
# QoS 1/2 messages held per client beyond the in-flight window (default 1000).
max_queued_messages 100
log_dest stdout
log_type all
connection_messages true
